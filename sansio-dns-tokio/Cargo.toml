[package]
name = "sansio-dns-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio driver for sansio-dns: resolve host names to addresses"
readme = "../README.md"
keywords = ["dns", "resolver", "tokio", "reqwest", "async"]
categories = ["network-programming", "asynchronous"]
# The files in tests/ are modules of tests/main.rs, one crate that builds once.
autotests = false

[dependencies]
sansio-dns.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync"] }
reqwest = { workspace = true, optional = true }

[features]
# Implements reqwest::dns::Resolve for Resolver.
reqwest = ["dep:reqwest"]
# DNS over TLS: sansio-dns's `tls` feature, for `Config::with_tls`.
tls = ["sansio-dns/tls"]

[dev-dependencies]
rcgen = "0.14"
reqwest = { workspace = true, features = ["rustls"] }
rstest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[example]]
name = "get"
required-features = ["reqwest"]

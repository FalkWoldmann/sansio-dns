[package]
name = "sansio-dns-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio driver for sansio-dns: resolve host names to addresses"
# The files in tests/ are modules of tests/main.rs, one crate that builds once.
autotests = false

[dependencies]
sansio-dns.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync"] }
reqwest = { workspace = true, optional = true }

[features]
# Implements reqwest::dns::Resolve for Resolver.
reqwest = ["dep:reqwest"]

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls"] }
rstest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[example]]
name = "get"
required-features = ["reqwest"]

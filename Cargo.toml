[package]
name = "sansio-dns"
version = "0.1.0"
edition = "2024"

[dependencies]
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }

[dev-dependencies]
compio = { version = "0.19.2", features = ["runtime", "net", "time", "macros"] }
proptest = "1.12.0"
rstest = "0.27.0"
tokio = { version = "1.53.3", features = ["net", "time", "rt", "macros"] }

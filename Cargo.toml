[package]
name = "sansio-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The files in tests/ are modules of tests/main.rs, one crate that builds once.
autotests = false

[workspace]
members = ["sansio-dns-tokio", "compare"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains, and the ICU crates under hickory-proto, need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FalkWoldmann/sansio-dns"

[workspace.dependencies]
sansio-dns = { path = ".", version = "0.1" }
sansio-dns-tokio = { path = "sansio-dns-tokio", version = "0.1" }
reqwest = { version = "0.13", default-features = false }
rstest = "0.27"
thiserror = "2"
tokio = "1"

[dependencies]
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
resolv-conf = "0.7"
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }

[features]
# DNS over TLS (RFC 7858). Brings rustls without a crypto provider: pass a
# ClientConfig built with the provider of your choice to Config::with_tls.
tls = ["dep:rustls"]

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"
compio = { version = "0.19", features = ["runtime", "net", "time", "macros", "io"] }
proptest = "1"
rstest.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Adapted from https://github.com/otto-de/rust-ecosystem (lints.toml), trimmed
# for a sans-IO library: no async or web lints; documentation lints added.
[lints]
workspace = true

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
ambiguous_negative_literals = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
enum_glob_use = "deny"
exit = "deny"
expect_used = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
fallible_impl_from = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
if_then_some_else_none = "deny"
ignore_without_reason = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
iter_filter_is_ok = "deny"
iter_filter_is_some = "deny"
large_types_passed_by_value = "deny"
manual_instant_elapsed = "deny"
manual_let_else = "deny"
match_same_arms = "deny"
match_wild_err_arm = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget = "deny"
missing_fields_in_debug = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_for_each = "deny"
needless_pass_by_value = "deny"
option_as_ref_cloned = "deny"
option_option = "deny"
or_fun_call = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_clone = "deny"
redundant_else = "deny"
ref_option = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_functions_in_if_condition = "deny"
semicolon_if_nothing_returned = "deny"
should_panic_without_expect = "deny"
single_match_else = "deny"
str_to_string = "deny"
string_lit_as_bytes = "deny"
suspicious_operation_groupings = "deny"
todo = "deny"
trait_duplication_in_bounds = "deny"
trivially_copy_pass_by_ref = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unnecessary_box_returns = "deny"
unnecessary_self_imports = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
zero_sized_map_values = "deny"
assertions_on_result_states = "warn"
string_slice = "warn"
unreachable = "warn"

[[test]]
name = "integration"
path = "tests/main.rs"

[[example]]
name = "dot"
required-features = ["tls"]

[[bench]]
name = "resolver"
harness = false

[[bench]]
name = "tls"
harness = false
required-features = ["tls"]

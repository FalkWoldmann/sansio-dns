[package]
name = "compare"
description = "Benchmarks sansio-dns-tokio against hickory-resolver; not published"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Default features, so the hickory CLI can read the system configuration too.
hickory-resolver = "0.26.3"
reqwest = { workspace = true, features = ["rustls"] }
sansio-dns.workspace = true
sansio-dns-tokio = { workspace = true, features = ["reqwest"] }
# Counts allocations for the allocs binary, without unsafe code of our own.
stats_alloc = "0.1.10"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "lookup"
harness = false

[[bin]]
name = "get-sansio"
path = "src/bin/get-sansio.rs"
test = false
bench = false

[[bin]]
name = "get-hickory"
path = "src/bin/get-hickory.rs"
test = false
bench = false

[[bin]]
name = "get-system"
path = "src/bin/get-system.rs"
test = false
bench = false
